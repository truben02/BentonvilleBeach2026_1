<!DOCTYPE html>
<html>
<head>
  <title>League Weeks</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background: #222;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar h2 {
      color: #fff;
    }

    .sidebar div {
      padding: 10px;
      cursor: pointer;
    }

    .sidebar div:hover {
      background: #444;
    }

    /* Main content */
    .content {
      flex: 1;
      padding: 20px;
      background: #f4f6f8;
    }

    .pools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .pool {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .pool h3 {
      margin-top: 0;
      text-align: center;
    }

    .team {
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

  </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Weeks</h2>
  <div onclick="loadWeek(1)">Week 1</div>
  <div onclick="loadWeek(2)">Week 2</div>
  <div onclick="loadWeek(3)">Week 3</div>
  <div onclick="loadWeek(4)">Week 4</div>
  <div onclick="loadWeek(5)">Week 5</div>
  <div onclick="loadWeek(6)">Week 6</div>
  <div onclick="loadWeek(7)">Week 7</div>
  <div onclick="loadWeek(8)">Week 8</div>
</div>

<!-- Main -->
<div class="content">

  <h1 id="title">Week 1</h1>

  <div class="pools">
    <div class="pool" id="poolA"><h3>Pool A</h3></div>
    <div class="pool" id="poolB"><h3>Pool B</h3></div>
    <div class="pool" id="poolC"><h3>Pool C</h3></div>
    <div class="pool" id="poolD"><h3>Pool D</h3></div>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyRLNVaeEvNzm3hGHqMHBjzscf1jXCjrHAmvK9JoKxL25FY_4TZokAizY3qhQJsSYPLKg/exec";

async function loadWeek(week){

  document.getElementById("title").innerText = "Week " + week;

  const sheetName = "4W" + week;

  const res = await fetch(API + "?sheet=" + sheetName);
  const data = await res.json();

  // Column B = index 1
  const col = 1;

  // Clear pools
  ["A","B","C","D"].forEach(p=>{
    document.getElementById("pool"+p).innerHTML = "<h3>Pool " + p + "</h3>";
  });

  function addTeams(start, end, poolId){
    let pool = document.getElementById(poolId);

    for(let i = start; i <= end; i++){
      let div = document.createElement("div");
      div.className = "team";
      div.innerText = data[i][col];
      pool.appendChild(div);
    }
  }

  // IMPORTANT: array is 0-based, sheet row 3 = index 2

  addTeams(2,7,"poolA");   // B3:B8
  addTeams(8,13,"poolB");  // B9:B14
  addTeams(14,19,"poolC"); // B15:B20
  addTeams(20,25,"poolD"); // B21:B26

}

// Load default
loadWeek(1);

</script>

</body>
</html>
