const API = "https://script.google.com/macros/s/AKfycbyRLNVaeEvNzm3hGHqMHBjzscf1jXCjrHAmvK9JoKxL25FY_4TZokAizY3qhQJsSYPLKg/exec";

// Get URL params
const params = new URLSearchParams(window.location.search);
const week = params.get("week");
const pool = params.get("pool");

document.getElementById("title").innerText = `Week ${week} - Pool ${pool}`;

// Map pools to sheet row ranges (0-indexed)
function getPoolRows(pool){
  if(pool === "A") return [2,7];    // rows 3-8
  if(pool === "B") return [8,13];   // rows 9-14
  if(pool === "C") return [14,19];  // rows 15-20
  if(pool === "D") return [20,25];  // rows 21-26
}

// Load matches and populate grid
async function loadMatches(){
  const sheetName = "4W" + week;
  const res = await fetch(API + "?sheet=" + sheetName);
  const data = await res.json();

  const [startRow, endRow] = getPoolRows(pool);
  const container = document.getElementById("matches");
  container.innerHTML = "";

  for(let i = startRow; i <= endRow; i++){
    // Columns mapping: N=13, O=14, P=15, Q=16 (0-indexed)
 const team1_col1 = data[i][13];
const team2_col1 = data[i][14];
const team1_col2 = data[i][15];
const team2_col2 = data[i][16];

// ADD THESE
const score1_col1 = data[i][17]; // R
const score2_col1 = data[i][18]; // S
const score1_col2 = data[i][19]; // T
const score2_col2 = data[i][20]; // U

createMatch(container, team1_col1, team2_col1, i, 17, 18, score1_col1, score2_col1);
createMatch(container, team1_col2, team2_col2, i, 19, 20, score1_col2, score2_col2);
  }
}

// Helper to create a match box
function createMatch(container, team1, team2, row, col1, col2, score1 = "", score2 = ""){
  const div = document.createElement("div");
  div.className = "match";

  div.innerHTML = `

      ${team2} <input class="score" data-row="${row}" data-col="${col2}" />

  `;

  if(e.target.classList.contains("score")){

    const value = e.target.value;

    await fetch(API,{
      method:"POST",
      body: JSON.stringify({ row, col, value })
    });
  }

// Load matches on page load

<body>

<h1 id="title"></h1>

<div class="grid" id="matches"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyRLNVaeEvNzm3hGHqMHBjzscf1jXCjrHAmvK9JoKxL25FY_4TZokAizY3qhQJsSYPLKg/exec";

// Get URL params
const params = new URLSearchParams(window.location.search);
const week = params.get("week");
const pool = params.get("pool");

document.getElementById("title").innerText =
  `Week ${week} - Pool ${pool}`;

function getPoolRange(pool){
  if(pool === "A") return [2,7];
  if(pool === "B") return [8,13];
  if(pool === "C") return [14,19];
  if(pool === "D") return [20,25];
}

async function loadMatches(){

  const sheetName = "4W" + week;

  const res = await fetch(API + "?sheet=" + sheetName);
  const data = await res.json();

  const [start, end] = getPoolRange(pool);

  const container = document.getElementById("matches");
  container.innerHTML = "";

  for(let i = start; i <= end; i++){

    // Column mapping
    const team1_col1 = data[i][13]; // N
    const team2_col1 = data[i][14]; // O

    const team1_col2 = data[i][15]; // P
    const team2_col2 = data[i][16]; // Q

    // Create two match boxes per row

    createMatch(container, team1_col1, team2_col1, i, 13, 14);
    createMatch(container, team1_col2, team2_col2, i, 15, 16);
  }

}

function createMatch(container, team1, team2, row, col1, col2){

  const div = document.createElement("div");
  div.className = "match";

  div.innerHTML = `
    <div class="team">
      ${team1}
      <input class="score" value="${score1 || ""}" data-row="${row}" data-col="${col1}" />
    </div>
    <div class="team">
      ${team2}
     <input class="score" value="${score2 || ""}" data-row="${row}" data-col="${col2}" />
    </div>
  `;

  container.appendChild(div);
}

// Save score on change
document.addEventListener("blur", async (e)=>{

  if(e.target.classList.contains("score")){

    const row = parseInt(e.target.dataset.row) + 1;
    const col = parseInt(e.target.dataset.col) + 1;
    const value = e.target.value;

    await fetch(API,{
      method:"POST",
      body: JSON.stringify({ row, col, value })
    });

  }

}, true);

loadMatches();

</script>
