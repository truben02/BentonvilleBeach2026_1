<!DOCTYPE html>
<html>
<head>
  <title>Pool Matches</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .topbar h1 {
      margin: 0;
      flex: 1;
      text-align: center;
    }

    .home-btn, .save-btn {
      font-size: 20px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .home-btn { background: #ddd; }
    .home-btn:hover { background: #bbb; }

    .save-btn { background: #4CAF50; color: white; }
    .save-btn:hover { background: #45a049; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .match {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .team {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .score {
      width: 40px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="topbar">
  <button class="home-btn" onclick="goHome()">🏠</button>
  <h1 id="title"></h1>
  <button class="save-btn" onclick="saveAllScores()">✅</button>
</div>

<div class="grid" id="matches"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyRLNVaeEvNzm3hGHqMHBjzscf1jXCjrHAmvK9JoKxL25FY_4TZokAizY3qhQJsSYPLKg/exec";

// Get URL params
const params = new URLSearchParams(window.location.search);
const week = params.get("week");
const pool = params.get("pool");

document.getElementById("title").innerText = `Week ${week} - Pool ${pool}`;

// Go back home
function goHome(){
  window.location.href = "index.html";
}

// Pool row ranges
function getPoolRows(pool){
  if(pool === "A") return [2,7];
  if(pool === "B") return [8,13];
  if(pool === "C") return [14,19];
  if(pool === "D") return [20,25];
}

// Load matches
async function loadMatches(){

  const res = await fetch(API + "?sheet=4W" + week);
  const data = await res.json();

  const [start, end] = getPoolRows(pool);
  const container = document.getElementById("matches");
  container.innerHTML = "";

  for(let i = start; i <= end; i++){

    // Teams
    const team1A = data[i][13]; // N
    const team2A = data[i][14]; // O
    const team1B = data[i][15]; // P
    const team2B = data[i][16]; // Q

    // Scores
    const score1A = data[i][17]; // R
    const score2A = data[i][18]; // S
    const score1B = data[i][19]; // T
    const score2B = data[i][20]; // U

    createMatch(container, team1A, team2A, i, 17, 18, score1A, score2A);
    createMatch(container, team1B, team2B, i, 19, 20, score1B, score2B);
  }
}

// Create match box
function createMatch(container, team1, team2, row, col1, col2, score1="", score2=""){

  const div = document.createElement("div");
  div.className = "match";

  div.innerHTML = `
    <div class="team">
      ${team1}
      <input class="score" value="${score1 || ""}" data-row="${row}" data-col="${col1}">
    </div>
    <div class="team">
      ${team2}
      <input class="score" value="${score2 || ""}" data-row="${row}" data-col="${col2}">
    </div>
  `;

  container.appendChild(div);
}

// Save all scores
async function saveAllScores(){

  const inputs = document.querySelectorAll(".score");

  for (let input of inputs){

    const row = parseInt(input.dataset.row) + 1;
    const col = parseInt(input.dataset.col) + 1;
    const value = input.value;

    if(value !== ""){
      await fetch(API,{
        method:"POST",
        body: JSON.stringify({
          row,
          col,
          value,
          sheet: "4W" + week
        })
      });
    }
  }

  alert("Scores saved!");
}

// Load page
loadMatches();

</script>

</body>
