<!DOCTYPE html>
<html>
<head>
  <title>Pool Matches</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .match {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .team {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .score {
      width: 40px;
      text-align: center;
    }

  </style>
</head>

<body>

<h1 id="title"></h1>

<div class="grid" id="matches"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyRLNVaeEvNzm3hGHqMHBjzscf1jXCjrHAmvK9JoKxL25FY_4TZokAizY3qhQJsSYPLKg/exec";

// Get URL params
const params = new URLSearchParams(window.location.search);
const week = params.get("week");
const pool = params.get("pool");

document.getElementById("title").innerText =
  `Week ${week} - Pool ${pool}`;

function getPoolRange(pool){
  if(pool === "A") return [2,7];
  if(pool === "B") return [8,13];
  if(pool === "C") return [14,19];
  if(pool === "D") return [20,25];
}

async function loadMatches(){

  const sheetName = "4W" + week;

  const res = await fetch(API + "?sheet=" + sheetName);
  const data = await res.json();

  const [start, end] = getPoolRange(pool);

  const container = document.getElementById("matches");
  container.innerHTML = "";

  for(let i = start; i <= end; i++){

    // Column mapping
    const team1_col1 = data[i][13]; // N
    const team2_col1 = data[i][14]; // O

    const team1_col2 = data[i][15]; // P
    const team2_col2 = data[i][16]; // Q

    // Create two match boxes per row

    createMatch(container, team1_col1, team2_col1, i, 13, 14);
    createMatch(container, team1_col2, team2_col2, i, 15, 16);
  }

}

function createMatch(container, team1, team2, row, col1, col2){

  const div = document.createElement("div");
  div.className = "match";

  div.innerHTML = `
    <div class="team">
      ${team1}
      <input class="score" data-row="${row}" data-col="${col1}" />
    </div>
    <div class="team">
      ${team2}
      <input class="score" data-row="${row}" data-col="${col2}" />
    </div>
  `;

  container.appendChild(div);
}

// Save score on change
document.addEventListener("blur", async (e)=>{

  if(e.target.classList.contains("score")){

    const row = parseInt(e.target.dataset.row) + 1;
    const col = parseInt(e.target.dataset.col) + 1;
    const value = e.target.value;

    await fetch(API,{
      method:"POST",
      body: JSON.stringify({ row, col, value })
    });

  }

}, true);

loadMatches();

</script>

</body>
</html>
